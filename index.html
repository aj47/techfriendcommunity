<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons don't vary by route, so they stay outside the block the server
         rewrites below. The .ico declares its sizes and favicon.svg declares
         none, which is what makes browsers that understand SVG prefer the SVG
         and leaves the .ico to the ones that don't.

         ?v= is what actually gets a new icon in front of someone who has been
         to the site before. A tab icon is the most aggressively cached thing a
         browser holds — it is kept per-origin, outlives a normal reload, and
         ignores the 4h max-age these are served with — so the bytes changing
         is not enough. A different URL is a different icon. Bump the number
         whenever the artwork in public/ changes. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <meta name="apple-mobile-web-app-title" content="techfriend" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <!-- Between these markers is the default metadata. convex/staticSite.ts
         replaces this whole block per route on the way out, so a link to a
         channel unfurls as that channel — crawlers never run the SPA. Keep the
         markers: without them the server can only rewrite the title element,
         and that fallback must not find a title tag written inside a comment. -->
    <!--meta:start-->
    <title>techfriend community</title>
    <meta name="description" content="Join the techfren community from your browser or inbox — no Discord account needed." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="techfriend community" />
    <meta property="og:title" content="techfriend community" />
    <meta property="og:description" content="Join the techfren community from your browser or inbox — no Discord account needed." />
    <!-- Absolute, and deliberately the canonical host rather than whatever
         origin served this: unfurlers resolve og:image on their own and several
         reject a relative one outright. The server rewrites this per route with
         its own origin; this default is what dev and any direct *.convex.site
         hit get. -->
    <meta property="og:image" content="https://www.techfriendcommunity.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="techfriendcommunity — the techfren Discord, on the web." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.techfriendcommunity.com/og.png" />
    <!--meta:end-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
