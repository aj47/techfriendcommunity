<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Link-preview card, 1200x630 (the 1.91:1 Twitter/Discord/Slack expect).
       The top two thirds are the landing page's cover art, which already
       carries the name, the member count and the address; cover.jpg is
       public/hero.webp at 1200x400. The strip under it is the app's own
       palette: zinc-950 ground, the "t_" mark, emerald on the second half of
       the wordmark exactly as the header renders it. -->

  <rect width="1200" height="630" fill="#09090b"/>
  <image xlink:href="cover.jpg" href="cover.jpg" x="0" y="0" width="1200" height="400"/>
  <rect x="0" y="400" width="1200" height="2" fill="#34d399" opacity="0.7"/>

  <!-- The "t_" mark on a zinc-900 tile, so it has an edge against the ground. -->
  <rect x="72.5" y="436.5" width="59" height="59" rx="12" fill="#18181b" stroke="#3f3f46"/>
  <g fill="#4ade80" shape-rendering="crispEdges">
    <rect x="79.5" y="451" width="7.5" height="3.75"/>
    <rect x="79.5" y="454.75" width="7.5" height="3.75"/>
    <rect x="75.75" y="458.5" width="22.5" height="3.75"/>
    <rect x="79.5" y="462.25" width="7.5" height="3.75"/>
    <rect x="79.5" y="466" width="7.5" height="3.75"/>
    <rect x="79.5" y="469.75" width="7.5" height="3.75"/>
    <rect x="94.5" y="469.75" width="3.75" height="3.75"/>
    <rect x="83.25" y="473.5" width="15" height="3.75"/>
    <rect x="105.75" y="473.5" width="22.5" height="3.75"/>
  </g>
  <text x="150" y="484" font-family="Inter Display, Inter, sans-serif" font-size="50" font-weight="600" letter-spacing="-1.5">
    <tspan fill="#fafafa">techfriend</tspan><tspan fill="#34d399">community</tspan>
  </text>

  <text x="72" y="548" font-family="Inter, sans-serif" font-size="30" font-weight="400" fill="#d4d4d8">Daily AI highlights, the latest links and live chat from the techfren Discord.</text>
  <text x="72" y="592" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#71717a">Read it, search it, post into it. No Discord account needed.</text>
</svg>
