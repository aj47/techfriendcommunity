<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Link-preview card, 1200x630 (the 1.91:1 Twitter/Discord/Slack expect).
       Everything that has to survive a crop stays inside a ~80px margin. The
       palette is the app's own: zinc-950 ground, the violet bolt, emerald on
       the second half of the wordmark exactly as the header renders it. -->
  <defs>
    <linearGradient id="bolt" x1="0.05" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8B3CFF"/>
      <stop offset="0.45" stop-color="#9A56FF"/>
      <stop offset="1" stop-color="#6D7DFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B3CFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8B3CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#09090b"/>
  <!-- Glow sits under the oversized mark so the right half isn't dead space. -->
  <ellipse cx="965" cy="300" rx="470" ry="400" fill="url(#glow)"/>
  <!-- Watermark bolt, bled off the right edge. -->
  <g opacity="0.13">
    <path transform="translate(806 -80) scale(16.7)" fill="url(#bolt)" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"/>
  </g>

  <!-- Mark, set a touch taller than the wordmark cap height so it anchors the stack. -->
  <path transform="translate(88 92) scale(2.3478)" fill="url(#bolt)" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"/>

  <text x="88" y="340" font-family="Inter Display, Inter, sans-serif" font-size="84" font-weight="600" letter-spacing="-2.5">
    <tspan fill="#fafafa">techfriend</tspan><tspan fill="#34d399">community</tspan>
  </text>

  <text x="88" y="408" font-family="Inter, sans-serif" font-size="36" font-weight="400" fill="#d4d4d8">The techfren Discord, on the web.</text>
  <text x="88" y="456" font-family="Inter, sans-serif" font-size="28" font-weight="400" fill="#71717a">Read it, search it, post into it — no Discord account needed.</text>

  <rect x="88" y="516" width="64" height="3" rx="1.5" fill="#34d399"/>
  <text x="88" y="566" font-family="Inter, sans-serif" font-size="24" font-weight="500" fill="#52525b">Live feed · Channels · Leaderboard · Resources</text>
  <text x="1112" y="566" text-anchor="end" font-family="Inter, sans-serif" font-size="24" font-weight="500" fill="#52525b">techfriendcommunity.com</text>
</svg>
