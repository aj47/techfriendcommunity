<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed square app tile. iOS and Android apply their own corner mask,
       so this must not round its own corners or leave transparent edges: a
       transparent apple-touch-icon composites onto black on some launchers and
       onto white on others. -->
  <defs>
    <linearGradient id="bolt" x1="0.05" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8B3CFF"/>
      <stop offset="0.45" stop-color="#9A56FF"/>
      <stop offset="1" stop-color="#6D7DFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.58">
      <stop offset="0" stop-color="#8B3CFF" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#8B3CFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#8B3CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#09090b"/>
  <rect width="512" height="512" fill="url(#glow)"/>
