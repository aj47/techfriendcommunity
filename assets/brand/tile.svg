<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed square app tile. iOS and Android apply their own corner mask,
       so this must not round its own corners or leave transparent edges: a
       transparent apple-touch-icon composites onto black on some launchers and
       onto white on others. Same "t_" as mark.svg, 28 units to a cell. -->
  <rect width="512" height="512" fill="#09090b"/>
  <g fill="#4ade80" shape-rendering="crispEdges">
    <rect x="88" y="158" width="56" height="28"/>
    <rect x="88" y="186" width="56" height="28"/>
    <rect x="60" y="214" width="168" height="28"/>
    <rect x="88" y="242" width="56" height="28"/>
    <rect x="88" y="270" width="56" height="28"/>
    <rect x="88" y="298" width="56" height="28"/>
    <rect x="200" y="298" width="28" height="28"/>
    <rect x="116" y="326" width="112" height="28"/>
    <rect x="284" y="326" width="168" height="28"/>
  </g>
</svg>
