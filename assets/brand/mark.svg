<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50" role="img" aria-label="techfriend community">
  <!-- The techfren bolt. The original Figma export drew this sheen with fifteen
       blurred ellipses behind an alpha mask: 9.5 KB that turned to mush below
       32px and rendered inconsistently wherever feGaussianBlur is approximated.
       Same silhouette, same violet-to-periwinkle sweep, three gradient stops.
       The sweep runs with the bolt's diagonal so the descending tail keeps the
       cool tip the original had. -->
  <defs>
    <linearGradient id="bolt" x1="0.05" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8B3CFF"/>
      <stop offset="0.45" stop-color="#9A56FF"/>
      <stop offset="1" stop-color="#6D7DFF"/>
    </linearGradient>
  </defs>
  <!-- 48x46 glyph centred on a 50x50 square: a hair of margin so tab strips and
       favicon grids don't shave the tips. -->
  <path transform="translate(1 2)" fill="url(#bolt)" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"/>
</svg>
