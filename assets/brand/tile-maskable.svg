<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable variant of tile.svg: the glyph sits inside the inner 80% safe
       circle, and the tile stays full-bleed with square corners because the
       launcher applies its own mask. 22 units to a cell. -->
  <rect width="512" height="512" fill="#09090b"/>
  <g fill="#4ade80" shape-rendering="crispEdges">
    <rect x="124" y="179" width="44" height="22"/>
    <rect x="124" y="201" width="44" height="22"/>
    <rect x="102" y="223" width="132" height="22"/>
    <rect x="124" y="245" width="44" height="22"/>
    <rect x="124" y="267" width="44" height="22"/>
    <rect x="124" y="289" width="44" height="22"/>
    <rect x="212" y="289" width="22" height="22"/>
    <rect x="146" y="311" width="88" height="22"/>
    <rect x="278" y="311" width="132" height="22"/>
  </g>
</svg>
