<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="techfriend community">
  <!-- A pixel "t" and the cursor after it: the tail of the "techfren_" on the
       landing page's cover art, in the same green. It is drawn on a 16x16
       grid, one cell to a pixel at favicon size, so every edge lands on a
       pixel boundary at 16, 32 and 48px. The dark tile gives it a ground on a
       light tab strip and disappears into a dark one. -->
  <rect width="64" height="64" rx="12" fill="#09090b"/>
  <g fill="#4ade80" shape-rendering="crispEdges">
    <rect x="8" y="16" width="8" height="4"/>
    <rect x="8" y="20" width="8" height="4"/>
    <rect x="4" y="24" width="24" height="4"/>
    <rect x="8" y="28" width="8" height="4"/>
    <rect x="8" y="32" width="8" height="4"/>
    <rect x="8" y="36" width="8" height="4"/>
    <rect x="24" y="36" width="4" height="4"/>
    <rect x="12" y="40" width="16" height="4"/>
    <rect x="36" y="40" width="24" height="4"/>
  </g>
</svg>
